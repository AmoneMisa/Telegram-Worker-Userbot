services:
  tg-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 4100
    volumes:
      - ./.env:/app/.env
      - ./photo-cache:/app/photo-cache
    ports:
      - "${TG_BIND_IP:-127.0.0.1}:${PORT:-4100}:4100"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4100/health').then(async r => { const b = await r.json(); if (!r.ok || b.ok !== true) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
