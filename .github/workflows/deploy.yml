name: deploy

# Autodeploy: every push to master is syntax/lockfile checked, then applied to
# the server over ssh by piping deploy/deploy.sh into a remote shell (so the
# server always runs the version of the script from the commit being deployed).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST         server hostname or IP
#   DEPLOY_USER         ssh user (e.g. root)
#   DEPLOY_SSH_KEY      private key whose public half is in the server's
#                       ~/.ssh/authorized_keys (ed25519, no passphrase)
# Optional:
#   DEPLOY_PORT         ssh port (default 22)
#   DEPLOY_KNOWN_HOSTS  server host key line; without it the host key is
#                       trusted on first use via ssh-keyscan
#   DEPLOY_PATH         checkout on the server (default /opt/tg-worker)
#   DEPLOY_SERVICE      systemd unit name (default tg-worker)

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never let two deploys touch the server at the same time.
concurrency:
  group: deploy-tg-worker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # Fails on a lockfile that doesn't match package.json — the exact thing
      # that would otherwise break `npm ci` on the server mid-deploy.
      - run: npm ci
      - run: npm run check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up ssh
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"  || { echo "::error::secret DEPLOY_SSH_KEY is not set"; exit 1; }
          test -n "$SSH_HOST" || { echo "::error::secret DEPLOY_HOST is not set"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "DEPLOY_KNOWN_HOSTS not set — trusting the host key on first use"
            ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          APP_DIR: ${{ secrets.DEPLOY_PATH }}
          SERVICE: ${{ secrets.DEPLOY_SERVICE }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" \
              -o BatchMode=yes -o ConnectTimeout=15 \
              "${SSH_USER:-root}@$SSH_HOST" \
              "APP_DIR='${APP_DIR:-/opt/tg-worker}' SERVICE='${SERVICE:-tg-worker}' BRANCH='$BRANCH' bash -s" \
              < deploy/deploy.sh
